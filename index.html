<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dear Dakota</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, #1e293b, #020617 70%);
        color: #e2e8f0;
      }
      main {
        max-width: 720px;
        padding: 3rem;
        text-align: center;
      }
      h1 {
        margin: 0 0 1rem;
        font-size: clamp(3rem, 8vw, 6rem);
        letter-spacing: 0.04em;
      }
      p {
        margin: 0;
        font-size: 1.2rem;
        line-height: 1.6;
        color: #cbd5e1;
      }
      .badge {
        display: inline-block;
        margin-bottom: 1.5rem;
        padding: 0.4rem 0.8rem;
        border: 1px solid rgba(148, 163, 184, 0.35);
        border-radius: 999px;
        font-size: 0.9rem;
        color: #94a3b8;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="badge">Dear Dakota</div>
      <h1>Coming Soon</h1>
      <p>
        The site is live and ready for updates. This is the first deployable
        placeholder page.
      </p>
    </main>
  </body>
</html>
